version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marslick-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./ai_model:/app/ai_model
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    restart: unless-stopped
